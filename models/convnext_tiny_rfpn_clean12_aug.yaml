schema_version: 1

id: convnext_tiny_rfpn_clean12_aug
display_name: "CardioSentry ConvNeXt-V1 Tiny + RFPN clean12 + augmented @768x1024"
version: convnext_tiny_v1_rfpn_clean12_aug_colab_a100_seed42
notes: "inference.pt from MyDrive/CardioSentry/new_runs/convnext_tiny_v1_rfpn_clean12_aug_colab_a100_seed42
        (config fingerprint 469d583e68ecf099). Same architecture, recipe and
        patient split (4eba80c7…) as convnext_tiny_rfpn_clean12, trained on the
        clean AND the stage-4 paper/photo augmented sheet of every clean12
        training record. The export holds the EMA weights of epoch 5, selected
        on validation pooled over both views (pathology macro AP 0.927). Test
        pathology macro AP: clean view 0.925, augmented view 0.924; on the clean
        view +0.0021 [+0.0000, +0.0043] over the clean-only run (paired patient
        bootstrap). Thresholds are the clinical_v1 policy refitted on this run's
        validation predictions (threshold-configurations/v1-rfpn-aug), not the
        per-label max-F1 thresholds frozen in the export.
        Parity, 2026-10-27: on 30 test records (seeded sample of the clean-only
        run's correct_prediction_samples), both views, the app loader
        reproduces this run's stored test probabilities within 1.1e-2 on the
        clean sheet (<= 0.084 logit on mid-range scores) and 7.1e-3 on the
        augmented sheet (<= 0.042 logit). CPU fp32 vs training BF16, the same
        gap as the clean-only Tiny (1.0e-2).
        The training sheets carry no printed header, so no header box is
        measured. Rendered sheets are edge-to-edge and fit-and-padded (fit:
        height_pad), not stretched."

weights: weights/convnext_tiny_rfpn_clean12_aug_inference.pt
expected_sha256: 782cb7a5b5402d708532ac843694627a8e67884f2b9df523c7c011d0bda06e6c
expected_protocol_fingerprint: 469d583e68ecf099

architecture:
  module: arch.convnext_v1_rfpn_clean12
  registry_key: convnext_tiny_rfpn_clean12
  pretrained: false
  call_style: tensor
  views: [[768, 1024]]

labels: [NORM, SB, STACH, LBBB, LQT, AF, AFL, 3AVB, 2AVB, 1AVB, STEMI, STE]
display_names:
  NORM: "Normal ECG"
  SB: "Sinus Bradycardia"
  STACH: "Sinus Tachycardia"
  LBBB: "Left Bundle Branch Block"
  LQT: "Long QT"
  AF: "Atrial Fibrillation"
  AFL: "Atrial Flutter"
  3AVB: "Third-Degree (Complete) AV Block"
  2AVB: "Second-Degree AV Block"
  1AVB: "First-Degree AV Block"
  STEMI: "ST-Elevation Myocardial Infarction"
  STE: "ST Elevation"

# clinical_v1 operating thresholds for THIS inference.pt (sha 782cb7a5…), copied
# at full precision from
# threshold-configurations/v1-rfpn-aug/outputs/thresholds_clinical_v1.json:
# the v1-rfpn study's rules unchanged, fitted on this run's validation
# predictions pooled over the clean and augmented views. NORM max sensitivity
# with Wilson-lower specificity >= 0.995; STEMI and 3AVB max specificity with
# Wilson-lower sensitivity >= 0.90; AF, AFL, 2AVB, STE max-F2; SB, STACH, LBBB,
# LQT, 1AVB max-F1 (= the export's checkpoint thresholds). Test sensitivity,
# clean / augmented view: STEMI 0.917 / 0.911, 3AVB 0.948 / 0.942. Research
# operating point, not cardiologist-approved. `source: checkpoint` restores the
# max-F1 thresholds.
thresholds:
  source: explicit
  explicit: [0.9449946880340576, 0.6540113687515259, 0.6601723432540894,
             0.7905303239822388, 0.6575384140014648, 0.31658050417900085,
             0.19682618975639343, 0.10970578342676163, 0.637030839920044,
             0.750552773475647, 0.20689405500888824, 0.2782568037509918]

output:
  suppressed_labels: []

# The clean12 render: LANCZOS fit to height 768 (994 px wide), then a
# symmetric 15 px paper-colour pad to 1024. No JPEG stage (lossless PNG).
preprocess:
  canvas: [1650, 1275]
  margin_px: 18
  input_size: [768, 1024]
  resample: pil_lanczos
  fit: height_pad
  match_training_jpeg: false
  jpeg_quality: 95
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

runtime:
  device: cpu
  dtype: float32
  num_threads: null

# Same module tree as convnext_tiny_rfpn_clean12: the backbone's last stage
# (768 ch, 24x32 grid) feeds both the ConvNeXt head and the neck's coarsest
# lateral.
explain:
  enabled: true
  target_layer: backbone.stages.3
  header_box: null
  header_redacted_in_training: false

verify:
  expected_scores: tests/fixtures/expected_scores_convnext_tiny_rfpn_clean12_aug.json
  score_tolerance: 2.0e-3
